<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090e">
<title>SPORTZONE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090e;
  --card:#10141d;
  --card2:#151a24;
  --line:#252b38;
  --text:#f5f7fb;
  --muted:#8c95a5;
  --blue:#4d7cff;
  --green:#32d583;
  --red:#ff5b68;
  --gold:#ffc857;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer;border:0;color:inherit}
.app{max-width:1180px;margin:auto;padding-bottom:90px}

/* HEADER */
header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,9,14,.94);
  backdrop-filter:blur(18px);
}
.logo{font-size:23px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--blue)}
.header-right{display:flex;gap:9px;align-items:center}
.icon-btn{
  width:42px;height:42px;border-radius:13px;
  background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:18px;
}
.points{
  padding:10px 13px;border-radius:12px;
  background:#121b2d;border:1px solid #26385e;
  font-weight:800;color:#8eafff;
}

/* NAV */
.sports{
  display:flex;gap:9px;padding:15px 18px;
  overflow-x:auto;scrollbar-width:none;
}
.sports::-webkit-scrollbar{display:none}
.sport{
  flex:0 0 auto;
  padding:11px 17px;border-radius:13px;
  background:var(--card);border:1px solid var(--line);
  color:var(--muted);font-weight:750;
}
.sport.active{background:var(--blue);color:white;border-color:var(--blue)}

/* HERO */
.hero{
  margin:4px 18px 18px;
  min-height:190px;
  border-radius:22px;
  padding:25px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 85% 20%,rgba(77,124,255,.38),transparent 35%),
    linear-gradient(135deg,#111827,#0b0e15);
  border:1px solid #283348;
}
.hero h1{font-size:31px;max-width:550px;line-height:1.08}
.hero p{color:var(--muted);margin-top:10px;max-width:560px}
.hero .hero-btn{
  margin-top:19px;padding:11px 17px;border-radius:12px;
  background:white;color:#0a0c11;font-weight:850;
}

/* SEARCH */
.search{
  margin:0 18px 15px;
  position:relative;
}
.search input{
  width:100%;height:48px;border-radius:14px;
  border:1px solid var(--line);background:var(--card);
  color:white;padding:0 16px 0 45px;outline:none;
}
.search input:focus{border-color:#4969b8}
.search-icon{position:absolute;left:16px;top:13px;color:var(--muted)}

/* SECTION */
.section{padding:0 18px;margin-top:21px}
.section-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.section-head h2{font-size:19px}
.section-head button{background:none;color:#7e9fff;font-weight:700}

/* FILTERS */
.filters{
  display:flex;gap:8px;overflow:auto;scrollbar-width:none;
  margin-bottom:13px;
}
.filter{
  flex:0 0 auto;padding:8px 13px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);
  color:var(--muted);font-size:13px;font-weight:700;
}
.filter.active{color:white;border-color:#4567bd;background:#17223c}

/* MATCH */
.matches{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.match{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px;
  transition:.18s;
}
.match:hover{transform:translateY(-2px);border-color:#35425c}
.match-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.live{color:var(--green);font-weight:850}
.match-teams{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.team{text-align:center;width:38%;font-weight:750}
.team-logo{
  width:45px;height:45px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--card2);margin:0 auto 7px;
  font-size:21px;
}
.score{text-align:center}
.score-main{font-size:27px;font-weight:900}
.time{font-size:11px;color:var(--muted);margin-top:2px}
.match-bottom{
  display:flex;justify-content:space-between;
  align-items:center;margin-top:15px;padding-top:12px;
  border-top:1px solid var(--line);
}
.stat{font-size:12px;color:var(--muted)}
.open{
  padding:8px 11px;border-radius:10px;
  background:#19243c;color:#8eafff;font-size:12px;font-weight:800;
}

/* UFC */
.fight{
  background:var(--card);border:1px solid var(--line);
  border-radius:17px;padding:16px;margin-bottom:10px;
}
.fight-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.fighters{display:flex;align-items:center;justify-content:space-between;text-align:center;margin-top:16px}
.fighter{width:39%;font-weight:850}
.avatar{
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(145deg,#303846,#11151d);
  display:grid;place-items:center;margin:auto auto 8px;
  font-size:25px;
}
.vs{font-size:12px;color:var(--muted);font-weight:900}

/* EMPTY */
.empty{
  text-align:center;padding:45px 20px;
  color:var(--muted);background:var(--card);
  border:1px dashed var(--line);border-radius:17px;
}

/* BOTTOM */
.bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  height:72px;background:rgba(9,11,17,.96);
  border-top:1px solid var(--line);
  backdrop-filter:blur(18px);
}
.bottom-inner{
  max-width:700px;margin:auto;height:100%;
  display:flex;justify-content:space-around;
}
.nav{
  width:25%;background:none;color:#737c8d;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;font-size:11px;font-weight:700;
}
.nav span:first-child{font-size:20px}
.nav.active{color:white}
.nav.active span:first-child{filter:drop-shadow(0 0 8px #4d7cff)}

/* MODAL */
.modal{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:flex-end;
  background:rgba(0,0,0,.7);
}
.modal.show{display:flex}
.sheet{
  width:100%;max-height:88vh;overflow:auto;
  background:#0d1119;border-top:1px solid #30394b;
  border-radius:25px 25px 0 0;
  padding:22px 18px 35px;
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close{
  width:35px;height:35px;border-radius:10px;
  background:var(--card2);font-size:19px;
}
.detail-score{text-align:center;margin:15px 0 25px}
.detail-score .teams{font-size:18px;font-weight:850}
.big-score{font-size:45px;font-weight:950;margin:8px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.detail-stat{
  padding:14px 8px;background:var(--card);
  border:1px solid var(--line);border-radius:13px;text-align:center;
}
.detail-stat b{display:block;font-size:19px}
.detail-stat span{font-size:11px;color:var(--muted)}
.login-form input{
  width:100%;height:48px;margin-bottom:10px;
  border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:white;padding:0 14px;outline:none;
}
.primary{
  width:100%;height:48px;border-radius:12px;
  background:var(--blue);font-weight:850;margin-top:5px;
}
.profile-card{
  background:linear-gradient(135deg,#141d31,#0e131c);
  border:1px solid #293753;border-radius:20px;
  padding:20px;margin-bottom:12px;
}
.profile-avatar{
  width:64px;height:64px;border-radius:18px;
  background:#24345b;display:grid;place-items:center;
  font-size:28px;margin-bottom:12px;
}
.profile-name{font-size:22px;font-weight:900}
.profile-sub{color:var(--muted);font-size:13px;margin-top:3px}
.profile-row{
  display:flex;justify-content:space-between;
  padding:15px 0;border-bottom:1px solid var(--line);
}
.profile-row:last-child{border:0}

/* DESKTOP */
@media(max-width:700px){
  .matches{grid-template-columns:1fr}
  .hero h1{font-size:26px}
}
@media(min-width:900px){
  .bottom{position:sticky;bottom:0;margin-top:30px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">SPORT<span>ZONE</span></div>
  <div class="header-right">
    <div class="points" id="points">⭐ 1 000</div>
    <button class="icon-btn" onclick="openProfile()">👤</button>
  </div>
</header>

<div class="sports">
  <button class="sport active" data-sport="football" onclick="setSport('football',this)">⚽ Футбол</button>
  <button class="sport" data-sport="hockey" onclick="setSport('hockey',this)">🏒 Хоккей</button>
  <button class="sport" data-sport="ufc" onclick="setSport('ufc',this)">🥊 UFC</button>
  <button class="sport" data-sport="favorites" onclick="setSport('favorites',this)">⭐ Избранное</button>
</div>

<div class="hero">
  <h1 id="heroTitle">Весь спорт — в одном месте</h1>
  <p id="heroText">Матчи, LIVE, результаты, статистика и турниры в едином интерфейсе.</p>
  <button class="hero-btn" onclick="showLive()">Смотреть LIVE</button>
</div>

<div class="search">
  <span class="search-icon">🔎</span>
  <input id="search" placeholder="Поиск команды, бойца или турнира..." oninput="render()">
</div>

<main id="content"></main>

</div>

<nav class="bottom">
  <div class="bottom-inner">
    <button class="nav active" onclick="home(this)">
      <span>⌂</span>Главная
    </button>
    <button class="nav" onclick="showLive(this)">
      <span>🔴</span>LIVE
    </button>
    <button class="nav" onclick="openFavorites(this)">
      <span>★</span>Избранное
    </button>
    <button class="nav" onclick="openProfile(this)">
      <span>●</span>Профиль
    </button>
  </div>
</nav>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeOutside(event)">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* =========================
   DATA
========================= */

const football=[
 {id:1,league:"АПЛ",country:"🏴",home:"Ливерпуль",away:"Арсенал",a:"🔴",b:"🔴",score:"2 : 1",time:"67'",live:true,stats:["57%","11","4"]},
 {id:2,league:"Ла Лига",country:"🇪🇸",home:"Барселона",away:"Атлетико",a:"🔵",b:"🔴",score:"1 : 1",time:"52'",live:true,stats:["61%","9","3"]},
 {id:3,league:"Бундеслига",country:"🇩🇪",home:"Бавария",away:"Дортмунд",a:"🔴",b:"🟡",score:"0 : 0",time:"28'",live:true,stats:["54%","5","2"]},
 {id:4,league:"Серия А",country:"🇮🇹",home:"Милан",away:"Интер",a:"🔴",b:"🔵",score:"2 : 2",time:"Завершён",live:false,stats:["49%","13","6"]},
 {id:5,league:"РПЛ",country:"🇷🇺",home:"Зенит",away:"Спартак",a:"🔵",b:"🔴",score:"— : —",time:"Сегодня 20:30",live:false,stats:["—","—","—"]},
 {id:6,league:"Лига 1",country:"🇫🇷",home:"ПСЖ",away:"Лион",a:"🔵",b:"🔴",score:"— : —",time:"Сегодня 22:45",live:false,stats:["—","—","—"]}
];

const hockey=[
 {id:101,league:"КХЛ",country:"🇷🇺",home:"СКА",away:"ЦСКА",a:"🏒",b:"🏒",score:"3 : 2",time:"2 период • 14:22",live:true,stats:["18","15","7"]},
 {id:102,league:"КХЛ",country:"🇷🇺",home:"Ак Барс",away:"Динамо М",a:"🟢",b:"🔵",score:"1 : 1",time:"1 период • 08:41",live:true,stats:["11","9","4"]},
 {id:103,league:"NHL",country:"🇺🇸",home:"Boston",away:"Rangers",a:"🐻",b:"🔵",score:"4 : 3",time:"Завершён",live:false,stats:["31","28","12"]},
 {id:104,league:"NHL",country:"🇺🇸",home:"Toronto",away:"Detroit",a:"🍁",b:"🔴",score:"— : —",time:"Завтра 02:00",live:false,stats:["—","—","—"]}
];

const ufc=[
 {id:201,league:"UFC • Main Event",home:"Islam Makhachev",away:"Charles Oliveira",a:"🥊",b:"🥊",score:"VS",time:"5 раундов",live:false,stats:["LW","—","—"]},
 {id:202,league:"UFC • Co-Main Event",home:"Jon Jones",away:"Tom Aspinall",a:"🥊",b:"🥊",score:"VS",time:"5 раундов",live:false,stats:["HW","—","—"]},
 {id:203,league:"UFC",home:"Max Holloway",away:"Justin Gaethje",a:"🥊",b:"🥊",score:"3 : 0",time:"Завершён",live:false,stats:["82","61","3"]},
 {id:204,league:"UFC",home:"Alex Pereira",away:"Jamahal Hill",a:"🥊",b:"🥊",score:"—",time:"Скоро",live:false,stats:["LHW","—","—"]}
];

let sport="football";
let favoriteIds=JSON.parse(localStorage.getItem("favorites")||"[]");
let points=Number(localStorage.getItem("points")||1000);
let username=localStorage.getItem("username")||"Гость";

/* =========================
   HELPERS
========================= */

function data(){
  if(sport==="football")return football;
  if(sport==="hockey")return hockey;
  if(sport==="ufc")return ufc;
  return [...football,...hockey,...ufc].filter(x=>favoriteIds.includes(x.id));
}

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function render(){
  const root=document.getElementById("content");
  const query=document.getElementById("search").value.toLowerCase().trim();
  let arr=data().filter(x=>
    !query ||
    x.home.toLowerCase().includes(query) ||
    x.away.toLowerCase().includes(query) ||
    x.league.toLowerCase().includes(query)
  );

  if(sport==="ufc"){
    root.innerHTML=`
      <section class="section">
        <div class="section-head">
          <h2>🥊 UFC</h2>
          <button onclick="showAll()">Все события</button>
        </div>
        <div id="list"></div>
      </section>`;
    renderUFC(arr);
    return;
  }

  root.innerHTML=`
    <section class="section">
      <div class="section-head">
        <h2>${sport==="hockey"?"🏒 Хоккей":"⚽ Футбол"}</h2>
        <button onclick="showLive()">Только LIVE</button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="matches" id="list"></div>
    </section>`;

  const leagues=[...new Set(arr.map(x=>x.league))];
  document.getElementById("filters").innerHTML=
    `<button class="filter active" onclick="filterLeague('all',this)">Все</button>`+
    leagues.map(l=>`<button class="filter" onclick="filterLeague('${l}',this)">${l}</button>`).join("");

  renderMatches(arr);
}

function renderMatches(arr){
  const list=document.getElementById("list");
  if(!arr.length){
    list.innerHTML=`<div class="empty">Ничего не найдено<br><small>Попробуй другое название</small></div>`;
    return;
  }

  list.innerHTML=arr.map(x=>`
    <article class="match" onclick="openMatch(${x.id})">
      <div class="match-top">
        <span>${x.country||"🌍"} ${escapeHTML(x.league)}</span>
        <span class="${x.live?"live":""}">${x.live?"● LIVE":x.time}</span>
      </div>

      <div class="match-teams">
        <div class="team">
          <div class="team-logo">${x.a}</div>
          ${escapeHTML(x.home)}
        </div>

        <div class="score">
          <div class="score-main">${x.score}</div>
          <div class="time">${x.live?x.time:""}</div>
        </div>

        <div class="team">
          <div class="team-logo">${x.b}</div>
          ${escapeHTML(x.away)}
        </div>
      </div>

      <div class="match-bottom">
        <span class="stat">📊 Статистика доступна</span>
        <button class="open" onclick="event.stopPropagation();openMatch(${x.id})">Открыть</button>
      </div>
    </article>
  `).join("");
}

function renderUFC(arr){
  const list=document.getElementById("list");
  if(!arr.length){
    list.innerHTML=`<div class="empty">Бойцов не найдено</div>`;
    return;
  }

  list.innerHTML=arr.map(x=>`
    <article class="fight" onclick="openMatch(${x.id})">
      <div class="fight-top">
        <span>${escapeHTML(x.league)}</span>
        <span>${x.time}</span>
      </div>

      <div class="fighters">
        <div class="fighter">
          <div class="avatar">${x.a}</div>
          ${escapeHTML(x.home)}
        </div>
        <div class="vs">${x.score==="VS"?"VS":x.score}</div>
        <div class="fighter">
          <div class="avatar">${x.b}</div>
          ${escapeHTML(x.away)}
        </div>
      </div>
    </article>
  `).join("");
}

/* =========================
   NAVIGATION
========================= */

function setSport(type,btn){
  sport=type;
  document.querySelectorAll(".sport").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  const title={
    football:"Футбол",
    hockey:"Хоккей",
    ufc:"UFC",
    favorites:"Избранное"
  }[type];

  document.getElementById("heroTitle").textContent=
    type==="favorites"?"Твои избранные события":`${title} — всё самое важное`;

  document.getElementById("heroText").textContent=
    type==="favorites"
      ?"Сохраняй интересные матчи и возвращайся к ним позже."
      :"Матчи, результаты, LIVE и подробная статистика.";

  render();
}

function home(btn){
  document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  sport="football";
  document.querySelectorAll(".sport").forEach(x=>x.classList.remove("active"));
  document.querySelector('[data-sport="football"]').classList.add("active");

  window.scrollTo({top:0,behavior:"smooth"});
  render();
}

function showLive(btn){
  if(btn){
    document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  }

  let all=[...football,...hockey,...ufc].filter(x=>x.live);

  document.getElementById("heroTitle").textContent="🔴 Прямо сейчас";
  document.getElementById("heroText").textContent="События, которые идут в данный момент.";

  document.getElementById("content").innerHTML=`
    <section class="section">
      <div class="section-head"><h2>LIVE</h2></div>
      <div class="matches" id="list"></div>
    </section>`;

  renderMatches(all);
}

function openFavorites(btn){
  if(btn){
    document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  }
  sport="favorites";
  document.querySelectorAll(".sport").forEach(x=>x.classList.remove("active"));
  document.querySelector('[data-sport="favorites"]').classList.add("active");
  render();
}

/* =========================
   FILTER
========================= */

function filterLeague(league,btn){
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  let arr=data();
  if(league!=="all")arr=arr.filter(x=>x.league===league);

  const q=document.getElementById("search").value.toLowerCase();
  if(q)arr=arr.filter(x=>
    x.home.toLowerCase().includes(q)||
    x.away.toLowerCase().includes(q)
  );

  renderMatches(arr);
}

function showAll(){
  render();
}

/* =========================
   MATCH MODAL
========================= */

function findMatch(id){
  return [...football,...hockey,...ufc].find(x=>x.id===id);
}

function openMatch(id){
  const x=findMatch(id);
  if(!x)return;

  const fav=favoriteIds.includes(x.id);

  document.getElementById("sheet").innerHTML=`
    <div class="sheet-head">
      <div>
        <div style="color:#8c95a5;font-size:12px">${escapeHTML(x.league)}</div>
        <h2 style="margin-top:4px">${x.live?"🔴 LIVE":"Событие"}</h2>
      </div>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="detail-score">
      <div class="teams">${escapeHTML(x.home)} — ${escapeHTML(x.away)}</div>
      <div class="big-score">${x.score}</div>
      <div style="color:${x.live?"#32d583":"#8c95a5"}">${x.time}</div>
    </div>

    <div class="detail-grid">
      <div class="detail-stat"><b>${x.stats[0]}</b><span>Показатель</span></div>
      <div class="detail-stat"><b>${x.stats[1]}</b><span>Показатель</span></div>
      <div class="detail-stat"><b>${x.stats[2]}</b><span>Показатель</span></div>
    </div>

    <button class="primary" style="margin-top:18px" onclick="toggleFavorite(${x.id)">
      ${fav?"★ Убрать из избранного":"☆ Добавить в избранное"}
    </button>
  `;

  openModal();
}

function toggleFavorite(id){
  if(favoriteIds.includes(id)){
    favoriteIds=favoriteIds.filter(x=>x!==id);
  }else{
    favoriteIds.push(id);
  }

  localStorage.setItem("favorites",JSON.stringify(favoriteIds));
  closeModal();
  render();
}

/* =========================
   PROFILE / LOGIN
========================= */

function openProfile(btn){
  if(btn){
    document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  }

  document.getElementById("sheet").innerHTML=`
    <div class="sheet-head">
      <h2>Профиль</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="profile-card">
      <div class="profile-avatar">👤</div>
      <div class="profile-name">${escapeHTML(username)}</div>
      <div class="profile-sub">Локальный демо-профиль</div>
    </div>

    <div class="profile-row">
      <span>⭐ Виртуальные очки</span>
      <b>${points.toLocaleString("ru-RU")}</b>
    </div>

    <div class="profile-row">
      <span>⭐ Избранных событий</span>
      <b>${favoriteIds.length}</b>
    </div>

    <button class="primary" onclick="openLogin()">Войти / создать профиль</button>
  `;

  openModal();
}

function openLogin(){
  document.getElementById("sheet").innerHTML=`
    <div class="sheet-head">
      <h2>Вход</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="login-form">
      <input id="loginName" placeholder="Введите имя">
      <input id="loginEmail" placeholder="Email (демо)" type="email">
      <button class="primary" onclick="login()">Продолжить</button>
    </div>

    <p style="color:#777f90;font-size:12px;text-align:center;margin-top:13px">
      Данные сохраняются только в браузере.
    </p>
  `;
}

function login(){
  const name=document.getElementById("loginName").value.trim();

  if(!name){
    alert("Введите имя");
    return;
  }

  username=name;
  localStorage.setItem("username",username);

  document.getElementById("sheet").innerHTML=`
    <div style="text-align:center;padding:30px 10px">
      <div style="font-size:55px">✅</div>
      <h2 style="margin-top:12px">Готово!</h2>
      <p style="color:#8c95a5;margin-top:8px">
        Профиль ${escapeHTML(username)} создан на этом устройстве.
      </p>
      <button class="primary" onclick="closeModal()">Продолжить</button>
    </div>
  `;
}

/* =========================
   MODAL
========================= */

function openModal(){
  document.getElementById("modal").classList.add("show");
  document.body.style.overflow="hidden";
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
  document.body.style.overflow="";
}

function closeOutside(e){
  if(e.target.id==="modal")closeModal();
}

/* =========================
   LIVE SIMULATION
========================= */

setInterval(()=>{
  football.forEach(x=>{
    if(x.live){
      let minute=parseInt(x.time)||0;
      minute++;
      if(minute>=90){
        x.live=false;
        x.time="Завершён";
      }else{
        x.time=minute+"'";
      }
    }
  });

  hockey.forEach(x=>{
    if(x.live){
      let m=x.time.match(/(\d+):(\d+)/);
      if(m){
        let sec=Number(m[1])*60+Number(m[2])+1;
        let min=Math.floor(sec/60);
        let s=String(sec%60).padStart(2,"0");
        x.time=x.time.split("•")[0]+"• "+min+":"+s;
      }
    }
  });

  if(document.querySelector(".live"))render();
},1000);

/* INIT */
document.getElementById("points").textContent=
  "⭐ "+points.toLocaleString("ru-RU");

render();
</script>
