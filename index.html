<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBET</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #101214;
    color: white;
}

header {
    height: 64px;
    background: #171a1d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 35px;
    border-bottom: 1px solid #292d31;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #35d06f;
}

.balance {
    background: #22272b;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: bold;
}

.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 20px;
}

.banner {
    background: linear-gradient(120deg, #126b38, #173a29);
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 25px;
}

.banner h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.banner p {
    color: #c8d8ce;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 330px;
    gap: 20px;
}

.card {
    background: #171a1d;
    border-radius: 12px;
    border: 1px solid #292d31;
    overflow: hidden;
    margin-bottom: 15px;
}

.card-title {
    padding: 16px 20px;
    border-bottom: 1px solid #292d31;
    font-size: 18px;
    font-weight: bold;
}

.match {
    padding: 18px 20px;
}

.league {
    color: #8e969d;
    font-size: 13px;
    margin-bottom: 15px;
}

.teams {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.team {
    font-size: 16px;
    font-weight: bold;
}

.vs {
    color: #7f878e;
    font-size: 13px;
}

.odds {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.odd {
    background: #252a2e;
    border: 1px solid #30363b;
    color: white;
    padding: 12px;
    border-radius: 7px;
    cursor: pointer;
    text-align: center;
}

.odd:hover {
    background: #35d06f;
    color: #07140c;
}

.odd span {
    display: block;
    color: #35d06f;
    font-weight: bold;
    margin-top: 4px;
}

.odd:hover span {
    color: #07140c;
}

.bet-title {
    padding: 18px;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #292d31;
}

.bet-content {
    padding: 20px;
}

.empty {
    text-align: center;
    color: #777f86;
    padding: 35px 10px;
}

.money {
    font-size: 25px;
    font-weight: bold;
    color: #35d06f;
}

input {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border-radius: 7px;
    border: 1px solid #353b40;
    background: #22272b;
    color: white;
    font-size: 15px;
}

.bet-button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: 0;
    border-radius: 7px;
    background: #35d06f;
    font-weight: bold;
    cursor: pointer;
}

@media (max-width: 800px) {
    .layout {
        grid-template-columns: 1fr;
    }

    header {
        padding: 0 15px;
    }

    .banner h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">FOOTBET</div>

    <div class="balance">
        Баланс: <span id="balance">10 000 ₽</span>
    </div>
</header>

<div class="container">

    <div class="banner">
        <h1>Футбол</h1>
        <p>Матчи и виртуальные прогнозы</p>
    </div>

    <div class="layout">

        <main>

            <div class="card">
                <div class="card-title">
                    ⚽ Сегодня
                </div>

                <div class="match">

                    <div class="league">
                        🇪🇸 Ла Лига
                    </div>

                    <div class="teams">
                        <div class="team">Барселона</div>
                        <div class="vs">20:00</div>
                        <div class="team">Реал Мадрид</div>
                    </div>

                    <div class="odds">
                        <button class="odd" onclick="selectBet('П1', 1.65)">
                            П1
                            <span>1.65</span>
                        </button>

                        <button class="odd" onclick="selectBet('X', 3.80)">
                            X
                            <span>3.80</span>
                        </button>

                        <button class="odd" onclick="selectBet('П2', 4.20)">
                            П2
                            <span>4.20</span>
                        </button>
                    </div>

                </div>
            </div>

            <div class="card">

                <div class="match">

                    <div class="league">
                        🇬🇧 Премьер-лига
                    </div>

                    <div class="teams">
                        <div class="team">Арсенал</div>
                        <div class="vs">22:00</div>
                        <div class="team">Челси</div>
                    </div>

                    <div class="odds">
                        <button class="odd" onclick="selectBet('П1', 1.90)">
                            П1
                            <span>1.90</span>
                        </button>

                        <button class="odd" onclick="selectBet('X', 3.50)">
                            X
                            <span>3.50</span>
                        </button>

                        <button class="odd" onclick="selectBet('П2', 3.70)">
                            П2
                            <span>3.70</span>
                        </button>
                    </div>

                </div>

            </div>

        </main>

        <aside class="card">

            <div class="bet-title">
                🎫 Мой прогноз
            </div>

            <div class="bet-content">

                <div id="selected" class="empty">
                    Выберите коэффициент
                </div>

                <input
                    id="amount"
                    type="number"
                    min="1"
                    placeholder="Сумма виртуального прогноза"
                >

                <button class="bet-button" onclick="makeBet()">
                    Сделать прогноз
                </button>

            </div>

        </aside>

    </div>
</div>

<script>

let balance = 10000;
let selectedOdd = null;

function selectBet(type, odd) {

    selectedOdd = odd;

    document.getElementById("selected").innerHTML =
        "Выбрано: <b>" + type + "</b><br><br>" +
        "Коэффициент: <b>" + odd + "</b>";
}

function makeBet() {

    const amount = Number(document.getElementById("amount").value);

    if (!selectedOdd) {
        alert("Сначала выберите коэффициент");
        return;
    }

    if (!amount || amount <= 0) {
        alert("Введите сумму");
        return;
    }

    if (amount > balance) {
        alert("Недостаточно виртуального баланса");
        return;
    }

    balance -= amount;

    const possibleWin = amount * selectedOdd;

    document.getElementById("balance").textContent =
        balance.toLocaleString("ru-RU") + " ₽";

    document.getElementById("selected").innerHTML =
        "Прогноз принят!<br><br>" +
        "Сумма: <b>" + amount.toLocaleString("ru-RU") + " ₽</b><br>" +
        "Возможный виртуальный выигрыш: <b>" +
        possibleWin.toLocaleString("ru-RU") +
        " ₽</b>";

    document.getElementById("amount").value = "";
}

</script>

</body>
</html>
