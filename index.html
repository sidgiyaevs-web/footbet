<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a10">
<title>SPORTZONE</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#080a10;color:#f5f7fb;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding-bottom:90px}

/* HEADER */
header{
 height:70px;padding:0 18px;display:flex;align-items:center;
 justify-content:space-between;border-bottom:1px solid #252b36;
 position:sticky;top:0;z-index:50;background:rgba(8,10,16,.95);
 backdrop-filter:blur(15px)
}
.logo{font-size:23px;font-weight:900}
.logo i{color:#4d7cff;font-style:normal}
.headerRight{display:flex;align-items:center;gap:8px}
.stars{background:#151c2c;border:1px solid #2b3957;padding:10px 13px;border-radius:12px;font-weight:800;color:#ffd45a}
.avatarBtn{width:42px;height:42px;border:1px solid #293142;background:#121620;border-radius:12px;color:white}

/* SPORTS */
.sports{display:flex;gap:8px;padding:15px 18px;overflow:auto}
.sports button{
 border:1px solid #272e3a;background:#11151d;color:#8e97a8;
 padding:11px 17px;border-radius:12px;font-weight:800;white-space:nowrap
}
.sports button.active{background:#4d7cff;color:white;border-color:#4d7cff}

/* HERO */
.hero{
 margin:4px 18px 18px;padding:25px;border-radius:22px;
 border:1px solid #293652;
 background:radial-gradient(circle at 85% 20%,#294ca044,transparent 35%),#10151f
}
.hero h1{font-size:29px;margin:0 0 9px}
.hero p{color:#8e97a8;margin:0;line-height:1.5}
.hero button{
 margin-top:18px;border:0;background:#fff;color:#090b10;
 padding:11px 17px;border-radius:11px;font-weight:900
}

/* SEARCH */
.search{margin:0 18px 18px;position:relative}
.search input{
 width:100%;height:48px;border-radius:13px;
 border:1px solid #272e3a;background:#11151d;color:white;
 padding:0 15px 0 43px;outline:0
}
.search span{position:absolute;left:15px;top:14px;color:#7d8798}

/* CONTENT */
.section{padding:0 18px;margin-top:20px}
.titleRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.titleRow h2{margin:0;font-size:20px}
.titleRow button{background:none;border:0;color:#7ea0ff;font-weight:800}

.filters{display:flex;gap:8px;overflow:auto;margin-bottom:13px}
.filter{
 border:1px solid #272e3a;background:#11151d;color:#8e97a8;
 padding:8px 12px;border-radius:10px;white-space:nowrap;font-size:13px
}
.filter.active{background:#182541;color:white;border-color:#4d7cff}

/* MATCHES */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.card{
 background:#11151d;border:1px solid #252c39;border-radius:17px;
 padding:15px;transition:.15s
}
.card:hover{transform:translateY(-2px);border-color:#394968}
.top{display:flex;justify-content:space-between;font-size:12px;color:#7f8999}
.live{color:#32d583;font-weight:900}
.teams{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.team{text-align:center;width:37%;font-weight:800;font-size:13px}
.badge{
 width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
 background:#1a202c;margin:0 auto 8px;font-size:22px
}
.middle{text-align:center}
.score{font-size:25px;font-weight:950}
.small{font-size:11px;color:#7f8999;margin-top:3px}
.bottom{
 border-top:1px solid #242b36;margin-top:14px;padding-top:11px;
 display:flex;justify-content:space-between;align-items:center
}
.openBtn{
 border:0;background:#182541;color:#8eafff;
 padding:8px 11px;border-radius:9px;font-size:12px;font-weight:800
}
.starBtn{background:none;border:0;font-size:20px;color:#727c8d}
.starBtn.on{color:#ffd45a}

/* UFC */
.fight{
 background:#11151d;border:1px solid #252c39;border-radius:17px;
 padding:16px;margin-bottom:10px
}
.fighters{display:flex;justify-content:space-between;align-items:center;text-align:center;margin-top:18px}
.fighter{width:40%;font-weight:850}
.face{
 width:64px;height:64px;border-radius:50%;margin:auto auto 8px;
 display:grid;place-items:center;background:#202633;font-size:27px
}
.vs{color:#7d8798;font-weight:900}

/* EMPTY */
.empty{
 padding:45px 15px;text-align:center;color:#7f8999;
 border:1px dashed #303746;border-radius:16px
}

/* BOTTOM */
.bottom{
 position:fixed;left:0;right:0;bottom:0;height:70px;z-index:60;
 background:rgba(9,11,17,.96);border-top:1px solid #252b36;
 backdrop-filter:blur(16px)
}
.bottomInner{max-width:650px;margin:auto;height:100%;display:flex}
.nav{
 flex:1;background:none;border:0;color:#70798a;font-size:11px;
 font-weight:800;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:4px
}
.nav b{font-size:20px}
.nav.active{color:white}

/* MODAL */
.modal{
 display:none;position:fixed;inset:0;z-index:100;
 background:#0009;align-items:flex-end
}
.modal.show{display:flex}
.sheet{
 width:100%;max-height:90vh;overflow:auto;
 background:#0d1118;border-top:1px solid #303847;
 border-radius:24px 24px 0 0;padding:21px 18px 35px
}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close{
 width:37px;height:37px;border:0;border-radius:10px;
 background:#181e28;color:white;font-size:21px
}

/* DETAIL */
.detail{text-align:center}
.detailTeams{font-size:18px;font-weight:900}
.detailScore{font-size:43px;font-weight:950;margin:10px}
.detailTime{color:#7f8999}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.stat{background:#141923;border:1px solid #252d3b;padding:14px 5px;border-radius:12px}
.stat b{font-size:18px;display:block}.stat span{font-size:11px;color:#7f8999}

/* PREDICTIONS */
.question{
 background:#141923;border:1px solid #272f3d;border-radius:14px;
 padding:14px;margin-top:10px
}
.question strong{display:block;margin-bottom:10px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.option{
 border:1px solid #303849;background:#10151d;color:#c8cfda;
 border-radius:10px;padding:10px;font-weight:750
}
.option.selected{background:#1b315f;border-color:#5b82e8;color:white}
.locked{opacity:.45;pointer-events:none}
.submit{
 width:100%;height:48px;border:0;border-radius:12px;
 background:#4d7cff;color:white;font-weight:900;margin-top:15px
}

/* LOGIN */
.form input{
 width:100%;height:48px;margin-bottom:9px;padding:0 13px;
 border:1px solid #2a3140;background:#131821;color:white;
 border-radius:11px;outline:0
}
.primary{
 width:100%;height:48px;background:#4d7cff;
 border:0;border-radius:11px;color:white;font-weight:900
}
.switch{background:none;border:0;color:#86a5ff;margin-top:13px;width:100%}

/* PROFILE */
.profile{
 background:linear-gradient(135deg,#18233b,#10151e);
 border:1px solid #2b3c60;border-radius:19px;padding:20px
}
.profileAvatar{
 width:62px;height:62px;border-radius:17px;background:#294273;
 display:grid;place-items:center;font-size:27px;margin-bottom:12px
}
.profileName{font-size:22px;font-weight:950}
.profileMuted{color:#8993a4;font-size:13px;margin-top:4px}
.row{
 display:flex;justify-content:space-between;padding:16px 2px;
 border-bottom:1px solid #252c38
}
.row:last-child{border:0}

/* TOAST */
.toast{
 position:fixed;left:50%;bottom:86px;z-index:200;
 transform:translate(-50%,20px);opacity:0;
 background:#f3f5f8;color:#090b10;padding:11px 16px;
 border-radius:12px;font-weight:850;pointer-events:none;
 transition:.25s
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:700px){
 .grid{grid-template-columns:1fr}
 .hero h1{font-size:25px}
}
</style>
</head>

<body>

<div class="app">

<header>
 <div class="logo">SPORT<i>ZONE</i></div>
 <div class="headerRight">
   <div class="stars" id="stars">⭐ 1 000</div>
   <button class="avatarBtn" onclick="profile()">👤</button>
 </div>
</header>

<div class="sports">
 <button class="active" onclick="sport('football',this)">⚽ Футбол</button>
 <button onclick="sport('hockey',this)">🏒 Хоккей</button>
 <button onclick="sport('ufc',this)">🥊 UFC</button>
 <button onclick="favorites()">⭐ Избранное</button>
</div>

<div class="hero">
 <h1 id="heroTitle">Спорт в одном месте</h1>
 <p id="heroText">
  Матчи, LIVE, статистика и прогнозы для тренировки.
 </p>
 <button onclick="live()">🔴 Смотреть LIVE</button>
</div>

<div class="search">
 <span>🔎</span>
 <input id="search" placeholder="Команда, боец или турнир..." oninput="render()">
</div>

<main id="content"></main>

</div>

<div class="bottom">
 <div class="bottomInner">
  <button class="nav active" onclick="home(this)"><b>⌂</b>Главная</button>
  <button class="nav" onclick="live(this)"><b>🔴</b>LIVE</button>
  <button class="nav" onclick="favorites(this)"><b>★</b>Избранное</button>
  <button class="nav" onclick="profile(this)"><b>●</b>Профиль</button>
 </div>
</div>

<div class="modal" id="modal" onclick="outside(event)">
 <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================
   ДАННЫЕ
========================= */

const football=[
 {id:1,l:"АПЛ",home:"Ливерпуль",away:"Арсенал",a:"🔴",b:"🔴",score:"2 : 1",time:"67'",live:true},
 {id:2,l:"Ла Лига",home:"Барселона",away:"Атлетико",a:"🔵",b:"🔴",score:"1 : 1",time:"52'",live:true},
 {id:3,l:"Бундеслига",home:"Бавария",away:"Дортмунд",a:"🔴",b:"🟡",score:"0 : 0",time:"28'",live:true},
 {id:4,l:"Серия А",home:"Милан",away:"Интер",a:"🔴",b:"🔵",score:"2 : 2",time:"Завершён",live:false},
 {id:5,l:"РПЛ",home:"Зенит",away:"Спартак",a:"🔵",b:"🔴",score:"— : —",time:"Сегодня 20:30",live:false},
 {id:6,l:"Лига 1",home:"ПСЖ",away:"Лион",a:"🔵",b:"🔴",score:"— : —",time:"Сегодня 22:45",live:false},
 {id:7,l:"Ла Лига",home:"Реал Мадрид",away:"Севилья",a:"⚪",b:"🔴",score:"— : —",time:"Завтра 21:00",live:false},
 {id:8,l:"АПЛ",home:"Челси",away:"Тоттенхэм",a:"🔵",b:"⚪",score:"— : —",time:"Завтра 19:30",live:false}
];

const hockey=[
 {id:101,l:"КХЛ",home:"СКА",away:"ЦСКА",a:"🏒",b:"🏒",score:"3 : 2",time:"2 период • 14:22",live:true},
 {id:102,l:"КХЛ",home:"Ак Барс",away:"Динамо М",a:"🟢",b:"🔵",score:"1 : 1",time:"1 период • 08:41",live:true},
 {id:103,l:"КХЛ",home:"Локомотив",away:"Спартак",a:"🚂",b:"🔴",score:"2 : 0",time:"Завершён",live:false},
 {id:104,l:"NHL",home:"Boston",away:"Rangers",a:"🐻",b:"🔵",score:"4 : 3",time:"Завершён",live:false},
 {id:105,l:"NHL",home:"Toronto",away:"Detroit",a:"🍁",b:"🔴",score:"— : —",time:"Завтра 02:00",live:false}
];

const ufc=[
 {id:201,l:"UFC • Main Event",home:"Islam Makhachev",away:"Charles Oliveira",a:"🥊",b:"🥊",score:"VS",time:"5 раундов",live:false},
 {id:202,l:"UFC • Co-Main Event",home:"Jon Jones",away:"Tom Aspinall",a:"🥊",b:"🥊",score:"VS",time:"5 раундов",live:false},
 {id:203,l:"UFC",home:"Max Holloway",away:"Justin Gaethje",a:"🥊",b:"🥊",score:"3 : 0",time:"Завершён",live:false},
 {id:204,l:"UFC",home:"Alex Pereira",away:"Jamahal Hill",a:"🥊",b:"🥊",score:"VS",time:"Скоро",live:false}
];

let current="football";
let fav=JSON.parse(localStorage.getItem("fav")||"[]");
let stars=Number(localStorage.getItem("stars")||1000);
let username=localStorage.getItem("username")||"Гость";
let answers={};

/* =========================
   ОСНОВНЫЕ ФУНКЦИИ
========================= */

function all(){
 return [...football,...hockey,...ufc];
}

function find(id){
 return all().find(x=>x.id===id);
}

function esc(x){
 return String(x).replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function setStars(){
 document.getElementById("stars").textContent=
  "⭐ "+stars.toLocaleString("ru-RU");
}

function save(){
 localStorage.setItem("stars",stars);
 localStorage.setItem("fav",JSON.stringify(fav));
 localStorage.setItem("username",username);
}

/* =========================
   РЕНДЕР
========================= */

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 let arr=current==="football"?football:
         current==="hockey"?hockey:
         current==="ufc"?ufc:
         all().filter(x=>fav.includes(x.id));

 arr=arr.filter(x=>
   !q ||
   x.home.toLowerCase().includes(q) ||
   x.away.toLowerCase().includes(q) ||
   x.l.toLowerCase().includes(q)
 );

 if(current==="ufc"){
  document.getElementById("content").innerHTML=`
   <section class="section">
    <div class="titleRow"><h2>🥊 UFC</h2></div>
    <div id="list"></div>
   </section>`;
  renderUFC(arr);
  return;
 }

 document.getElementById("content").innerHTML=`
  <section class="section">
   <div class="titleRow">
    <h2>${current==="hockey"?"🏒 Хоккей":"⚽ Футбол"}</h2>
    <button onclick="live()">LIVE →</button>
   </div>

   <div class="filters">
    <button class="filter active" onclick="league('all',this)">Все</button>
    ${[...new Set(arr.map(x=>x.l))].map(x=>
      `<button class="filter" onclick="league('${x}',this)">${x}</button>`
    ).join("")}
   </div>

   <div class="grid" id="list"></div>
  </section>`;

 renderMatches(arr);
}

function renderMatches(arr){
 const list=document.getElementById("list");

 if(!arr.length){
  list.innerHTML=`<div class="empty">Ничего не найдено</div>`;
  return;
 }

 list.innerHTML=arr.map(x=>{
  let isFav=fav.includes(x.id);

  return `
  <article class="card" onclick="match(${x.id})">

   <div class="top">
    <span>${esc(x.l)}</span>
    <span class="${x.live?"live":""}">
     ${x.live?"● LIVE":x.time}
    </span>
   </div>

   <div class="teams">

    <div class="team">
     <div class="badge">${x.a}</div>
     ${esc(x.home)}
    </div>

    <div class="middle">
     <div class="score">${x.score}</div>
     <div class="small">${x.live?x.time:""}</div>
    </div>

    <div class="team">
     <div class="badge">${x.b}</div>
     ${esc(x.away)}
    </div>

   </div>

   <div class="bottom">
    <button class="starBtn ${isFav?"on":""}"
      onclick="event.stopPropagation();toggleFav(${x.id})">
      ${isFav?"★":"☆"}
    </button>

    <span class="small">📊 Статистика</span>

    <button class="openBtn"
      onclick="event.stopPropagation();match(${x.id})">
      Открыть
    </button>
   </div>

  </article>`;
 }).join("");
}

function renderUFC(arr){
 const list=document.getElementById("list");

 if(!arr.length){
  list.innerHTML=`<div class="empty">Ничего не найдено</div>`;
  return;
 }

 list.innerHTML=arr.map(x=>`
  <article class="fight" onclick="match(${x.id})">

   <div class="top">
    <span>${esc(x.l)}</span>
    <span>${x.time}</span>
   </div>

   <div class="fighters">

    <div class="fighter">
     <div class="face">${x.a}</div>
     ${esc(x.home)}
    </div>

    <div class="vs">${x.score}</div>

    <div class="fighter">
     <div class="face">${x.b}</div>
     ${esc(x.away)}
    </div>

   </div>

  </article>
 `).join("");
}

/* =========================
   СПОРТ
========================= */

function sport(type,btn){
 current=type;

 document.querySelectorAll(".sports button")
  .forEach(x=>x.classList.remove("active"));

 btn.classList.add("active");

 document.getElementById("heroTitle").textContent=
  type==="football"?"⚽ Футбол":
  type==="hockey"?"🏒 Хоккей":"🥊 UFC";

 render();
}

function home(btn){
 document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");

 current="football";
 document.querySelectorAll(".sports button").forEach(x=>x.classList.remove("active"));
 document.querySelector(".sports button").classList.add("active");

 document.getElementById("heroTitle").textContent="Спорт в одном месте";
 document.getElementById("heroText").textContent=
  "Матчи, LIVE, статистика и прогнозы для тренировки.";

 render();
 window.scrollTo({top:0,behavior:"smooth"});
}

function league(name,btn){
 document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");

 let arr=current==="football"?football:hockey;
 if(name!=="all")arr=arr.filter(x=>x.l===name);

 renderMatches(arr);
}

function live(btn){
 if(btn){
  document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
 }

 let arr=all().filter(x=>x.live);

 document.getElementById("heroTitle").textContent="🔴 LIVE";
 document.getElementById("heroText").textContent=
  "События, которые идут прямо сейчас.";

 document.getElementById("content").innerHTML=`
  <section class="section">
   <div class="titleRow"><h2>Сейчас</h2></div>
   <div class="grid" id="list"></div>
  </section>`;

 renderMatches(arr);
}

function favorites(btn){
 if(btn){
  document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
 }

 current="favorites";
 render();
}

function toggleFav(id){
 if(fav.includes(id))
  fav=fav.filter(x=>x!==id);
 else
  fav.push(id);

 save();
 render();
 toast(fav.includes(id)?"Добавлено в избранное":"Удалено из избранного");
}

/* =========================
   MATCH
========================= */

function match(id){
 const x=find(id);
 if(!x)return;

 let isUFC=x.id>=200;

 document.getElementById("sheet").innerHTML=`

 <div class="modalHead">
  <div>
   <small style="color:#7f8999">${esc(x.l)}</small>
   <h2 style="margin:5px 0 0">${x.live?"🔴 LIVE":"Событие"}</h2>
  </div>
  <button class="close" onclick="closeModal()">×</button>
 </div>

 <div class="detail">

  <div class="detailTeams">
   ${esc(x.home)} — ${esc(x.away)}
  </div>

  <div class="detailScore">${x.score}</div>
  <div class="detailTime">${x.time}</div>

 </div>

 <div class="stats">
  <div class="stat"><b>${isUFC?"3":"57%"}</b><span>Атаки</span></div>
  <div class="stat"><b>${isUFC?"2":"11"}</b><span>Удары</span></div>
  <div class="stat"><b>${isUFC?"1":"4"}</b><span>В створ</span></div>
 </div>

 ${x.live?
 `<div class="question">
   <strong>🔴 Событие идёт в LIVE</strong>
   <div style="color:#8993a4;font-size:13px">
    Следи за счётом и статистикой в реальном времени.
   </div>
  </div>`:""}

 <div class="question">
  <strong>🎯 Тренировочный прогноз</strong>

  <div class="options">
   <button class="option" onclick="choose(${x.id},'A',this)">
    ${esc(x.home)}
   </button>

   <button class="option" onclick="choose(${x.id},'B',this)">
    ${esc(x.away)}
   </button>

   ${!isUFC?
   `<button class="option" onclick="choose(${x.id},'DRAW',this)">
     Ничья
    </button>`:""}

   <button class="option" onclick="choose(${x.id},'SCORE',this)">
    Точный счёт
   </button>
  </div>

  <button class="submit" onclick="submitPrediction(${x.id})">
   Сохранить прогноз
  </button>
 </div>

 <div class="question">
  <strong>📊 Подробная статистика</strong>
  <div style="color:#8993a4;line-height:1.7;font-size:13px">
   Владение • удары • атаки • форма • последние результаты
   • очные встречи
  </div>
 </div>
 `;

 openModal();
}

function choose(id,value,btn){
 document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
 btn.classList.add("selected");

 answers[id]=value;
}

function submitPrediction(id){
 const x=find(id);

 if(!answers[id]){
  toast("Сначала выбери вариант");
  return;
 }

 if(x.live){
  toast("Матч уже идёт — прогноз закрыт");
  return;
 }

 localStorage.setItem("prediction_"+id,answers[id]);

 stars+=10;
 save();
 setStars();

 toast("Прогноз сохранён • +10 ⭐");

 setTimeout(closeModal,700);
}

/* =========================
   PROFILE
========================= */

function profile(btn){
 if(btn){
  document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
 }

 document.getElementById("sheet").innerHTML=`
  <div class="modalHead">
   <h2>Профиль</h2>
   <button class="close" onclick="closeModal()">×</button>
  </div>

  <div class="profile">
   <div class="profileAvatar">👤</div>
   <div class="profileName">${esc(username)}</div>
   <div class="profileMuted">Локальный аккаунт</div>
  </div>

  <div class="row">
   <span>⭐ Звёзды</span>
   <b>${stars.toLocaleString("ru-RU")}</b>
  </div>

  <div class="row">
   <span>⭐ Избранных</span>
   <b>${fav.length}</b>
  </div>

  <button class="primary" style="margin-top:15px" onclick="login()">
   ${username==="Гость"?"Войти / зарегистрироваться":"Изменить профиль"}
  </button>
 `;

 openModal();
}

function login(){
 document.getElementById("sheet").innerHTML=`
  <div class="modalHead">
   <h2>Вход / регистрация</h2>
   <button class="close" onclick="closeModal()">×</button>
  </div>

  <div class="form">
   <input id="name" placeholder="Имя или никнейм">
   <input id="email" placeholder="Email">
   <input id="password" placeholder="Пароль" type="password">

   <button class="primary" onclick="register()">
    Продолжить
   </button>
  </div>

  <button class="switch" onclick="toast('Это локальная демо-регистрация')">
   Как это работает?
  </button>

  <p style="color:#737d8e;font-size:12px;text-align:center;margin-top:12px">
   Аккаунт работает локально в этом браузере.
  </p>
 `;
}

function register(){
 const name=document.getElementById("name").value.trim();
 const email=document.getElementById("email").value.trim();
 const pass=document.getElementById("password").value;

 if(!name||!email||!pass){
  toast("Заполни все поля");
  return;
 }

 username=name;
 save();

 document.getElementById("sheet").innerHTML=`
  <div style="text-align:center;padding:30px 5px">
   <div style="font-size:55px">✅</div>
   <h2>Профиль создан</h2>
   <p style="color:#8993a4">
    Добро пожаловать, ${esc(username)}!
   </p>
   <button class="primary" onclick="closeModal()">
    Продолжить
   </button>
  </div>
 `;

 toast("Регистрация завершена");
}

/* =========================
   MODAL
========================= */

function openModal(){
 document.getElementById("modal").classList.add("show");
 document.body.style.overflow="hidden";
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
 document.body.style.overflow="";
}

function outside(e){
 if(e.target.id==="modal")closeModal();
}

/* =========================
   LIVE TIMER
========================= */

setInterval(()=>{
 football.forEach(x=>{
  if(x.live){
   let n=parseInt(x.time);
   if(!isNaN(n)){
    n++;
    if(n>=90){
     x.live=false;
     x.time="Завершён";
    }else x.time=n+"'";
   }
  }
 });

 render();
},60000);

/* TOAST */
function toast(text){
 const t=document.getElementById("toast");
 t.textContent=text;
 t.classList.add("show");

 setTimeout(()=>t.classList.remove("show"),1800);
}

/* START */
setStars();
render();
</script>

</body>
</html>
